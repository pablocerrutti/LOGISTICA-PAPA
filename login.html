<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visita del Papa León XIV - Mapa Logístico — Acceso</title><style>*{box-sizing:border-box}html,body{min-height:100%;min-width:100%}body{margin:0;font-family:system-ui,Segoe UI,sans-serif;background:linear-gradient(135deg,#063b68,#0b568e);min-height:100vh;display:flex;align-items:center;justify-content:center}.loginLoader{position:fixed;inset:0;z-index:5000;background:linear-gradient(135deg,#063b68 0%,#0b568e 52%,#173f67 100%);display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;transition:opacity .5s ease,visibility .5s ease}.loginLoader::before{content:"";position:absolute;inset:-3%;background:url("https://raw.githubusercontent.com/pablocerrutti/LOGISTICA-PAPA/main/LEON%20XIV.png") center center/contain no-repeat;opacity:.5;pointer-events:none;mask-image:radial-gradient(ellipse 68% 68% at center, #000 52%, transparent 100%);-webkit-mask-image:radial-gradient(ellipse 68% 68% at center, #000 52%, transparent 100%)}.loginLoader.hide{opacity:0;visibility:hidden}.loginLoaderBox{position:relative;z-index:1;width:min(92vw,430px);padding:30px 22px}.loginLoaderTitle{font-size:24px;font-weight:900;color:#123e65;margin:0 0 7px}.loginLoaderSub{font-size:12px;color:#667784}.loginSpinner{width:42px;height:42px;border:4px solid #dbe5ed;border-top-color:#123e65;border-radius:50%;margin:22px auto 0;animation:loginSpin .9s linear infinite}@keyframes loginSpin{to{transform:rotate(360deg)}}.card{width:min(480px,calc(100% - 30px));background:#fff;border-radius:18px;box-shadow:0 22px 70px #001d3538;padding:34px;text-align:center}.logo{height:78px;max-width:240px;object-fit:contain;margin:14px auto 10px;display:block}.title{font-size:28px;font-weight:900;color:#123e65}.inst{font-size:15px;font-weight:700;color:#123e65;margin:5px 0 7px}.sub{font-size:12px;color:#667784;margin-bottom:22px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{padding:18px 10px;border-radius:10px;border:1px solid #d9e1e7;background:#f8fafb;font-weight:900;cursor:pointer}.p{background:#123e65;color:#fff;border-color:#123e65}.d{border-color:#123e65;color:#123e65}.public{width:100%;margin-top:10px;background:#f4f7f9;border-color:#b9c9d6;color:#123e65}.form{margin-top:18px;display:grid;gap:8px}.form input{padding:12px;border:1px solid #d9e1e7;border-radius:8px;font:inherit}.primary{background:#123e65;color:#fff;border-color:#123e65}.back{border:0;background:transparent;font-size:11px;color:#667784;cursor:pointer}.sel{font-size:12px;font-weight:850;color:#173f67}.err{font-size:11px;color:#b42318;min-height:16px}.hidden{display:none!important}.publicHint{font-size:10px;color:#7a8790;margin-top:8px}</style></head><body><div id="loginLoader" class="loginLoader"><div class="loginLoaderBox"><div class="loginLoaderTitle">Visita del Papa León XIV</div><div class="loginLoaderSub">Cargando sistema logístico...</div><div class="loginSpinner"></div></div></div><div class="card"><div class="title">Visita del Papa León XIV - Mapa Logístico</div><img class="logo" src="Logo.png" alt="Intendencia Departamental de Florida"><div class="inst">Intendencia Departamental de Florida</div><div class="sub">Seleccione el módulo al que desea acceder</div><div class="buttons"><button class="btn p" data-r="presentador">PRESENTADOR</button><button class="btn d" data-r="diseñador">DISEÑO</button></div><button class="btn public" id="publicAccess">🌐 ACCESO PÚBLICO</button><div class="publicHint">Consultar el mapa interactivo y la operativa sin iniciar sesión</div><div id="form" class="form hidden"><div id="sel" class="sel"></div><input id="pass" type="password" placeholder="Contraseña" autocomplete="off"><button id="enter" class="btn primary">Ingresar</button><button id="back" class="back">Volver</button><div id="err" class="err"></div></div></div><script>window.addEventListener("load",()=>setTimeout(()=>document.getElementById("loginLoader").classList.add("hide"),500));const make=a=>String.fromCharCode(...a),pw={presentador:make([65,100,109,105,110,50,48,50,54,43]),diseñador:make([73,107,51,114,50,48,50,54])};let role="";document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{role=b.dataset.r;form.classList.remove("hidden");sel.textContent=role==="presentador"?"Acceso al módulo PRESENTADOR":"Acceso al módulo DISEÑO";pass.value="";err.textContent="";pass.focus()});publicAccess.onclick=()=>{sessionStorage.removeItem("logisticaPapaRole");location.href="publico.html"};back.onclick=()=>form.classList.add("hidden");enter.onclick=()=>{if(pass.value===pw[role]){sessionStorage.setItem("logisticaPapaRole",role);location.href=role==="presentador"?"presentador.html":"diseño.html"}else err.textContent="Contraseña incorrecta"};pass.onkeydown=e=>{if(e.key==="Enter")enter.click()};</script></body></html>
