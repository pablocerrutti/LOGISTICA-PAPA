<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operativo Florida — Acceso</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,sans-serif;background:linear-gradient(135deg,#063b68,#0b568e);min-height:100vh;display:flex;align-items:center;justify-content:center}.card{width:min(480px,calc(100% - 30px));background:#fff;border-radius:18px;box-shadow:0 22px 70px #001d3538;padding:34px;text-align:center}.logo{height:92px;max-width:260px;object-fit:contain;margin:0 auto 18px;display:block}.title{font-size:28px;font-weight:900;color:#123e65}.inst{font-size:15px;font-weight:700;color:#123e65;margin:5px 0 7px}.sub{font-size:12px;color:#667784;margin-bottom:22px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{padding:18px 10px;border-radius:10px;border:1px solid #d9e1e7;background:#f8fafb;font-weight:900;cursor:pointer}.p{background:#123e65;color:#fff;border-color:#123e65}.d{border-color:#123e65;color:#123e65}.public{width:100%;margin-top:10px;background:#f4f7f9;border-color:#b9c9d6;color:#123e65}.form{margin-top:18px;display:grid;gap:8px}.form input{padding:12px;border:1px solid #d9e1e7;border-radius:8px;font:inherit}.primary{background:#123e65;color:#fff;border-color:#123e65}.back{border:0;background:transparent;font-size:11px;color:#667784;cursor:pointer}.sel{font-size:12px;font-weight:850;color:#173f67}.err{font-size:11px;color:#b42318;min-height:16px}.hidden{display:none!important}.publicHint{font-size:10px;color:#7a8790;margin-top:8px}</style></head><body><div class="card"><img class="logo" src="logodepartamentoabierto.jpg" alt="Intendencia Departamental de Florida"><div class="title">Operativo Florida</div><div class="inst">Intendencia Departamental de Florida</div><div class="sub">Seleccione el módulo al que desea acceder</div><div class="buttons"><button class="btn p" data-r="presentador">PRESENTADOR</button><button class="btn d" data-r="diseñador">DISEÑO</button></div><button class="btn public" id="publicAccess">🌐 ACCESO PÚBLICO</button><div class="publicHint">Consultar el mapa interactivo y la operativa sin iniciar sesión</div><div id="form" class="form hidden"><div id="sel" class="sel"></div><input id="pass" type="password" placeholder="Contraseña" autocomplete="off"><button id="enter" class="btn primary">Ingresar</button><button id="back" class="back">Volver</button><div id="err" class="err"></div></div></div><script>const make=a=>String.fromCharCode(...a),pw={presentador:make([65,100,109,105,110,50,48,50,54,43]),diseñador:make([73,107,51,114,50,48,50,54])};let role="";document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{role=b.dataset.r;form.classList.remove("hidden");sel.textContent=role==="presentador"?"Acceso al módulo PRESENTADOR":"Acceso al módulo DISEÑO";pass.value="";err.textContent="";pass.focus()});publicAccess.onclick=()=>{sessionStorage.removeItem("logisticaPapaRole");location.href="publico.html"};back.onclick=()=>form.classList.add("hidden");enter.onclick=()=>{if(pass.value===pw[role]){sessionStorage.setItem("logisticaPapaRole",role);location.href=role==="presentador"?"presentador.html":"diseño.html"}else err.textContent="Contraseña incorrecta"};pass.onkeydown=e=>{if(e.key==="Enter")enter.click()};</script></body></html>
